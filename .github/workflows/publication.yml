name: Publish after three quiet minutes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication-main
  cancel-in-progress: true

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'chore: publish after three quiet minutes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 2
          sparse-checkout: |
            scripts
            .netlify
      - name: Wait for three minutes without a new publication
        run: node scripts/release-after-quiet.mjs
